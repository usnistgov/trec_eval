name: Test Rust

on:
  pull_request:
    paths:
      - "te-rust/**"
      - "te-python/src/**"
      - "te-python/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/test-rust.yml"
  push:
    branches:
      - trec_eval_v11
    paths:
      - "te-rust/**"
      - "te-python/src/**"
      - "te-python/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/test-rust.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust-version: ["1.85.0", "stable"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust-version }}

      - name: Read pinned C trec_eval commit
        id: trec_eval_ref
        run: |
          COMMIT=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["metadata"]["trec_eval_ref"]["commit"])')
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Fetch pinned C trec_eval commit
        run: git fetch --no-tags --depth=1 origin "${{ steps.trec_eval_ref.outputs.commit }}"

      - name: Run Rust tests
        run: cargo test

      - name: Run C-parity regression tests
        run: cargo test -p te-rust --test c_parity -- --ignored
