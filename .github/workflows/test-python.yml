name: Test Python

on:
  pull_request:
    paths:
      - "te-python/**"
      - "te-rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/test-python.yml"
  push:
    branches:
      - trec_eval_v11
    paths:
      - "te-python/**"
      - "te-rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/test-python.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Python tests
        run: uv run --python ${{ matrix.python-version }} --project te-python --extra dev pytest te-python/tests
