name: Test Python

on:
  pull_request:
    paths:
      - "te-python/**"
      - "te-rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/test-python.yml"
  push:
    branches:
      - main
    paths:
      - "te-python/**"
      - "te-rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/test-python.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Python tests
        run: uv run --project te-python --extra dev pytest te-python/tests

      - name: Run Rust tests for Python extension crate
        run: cargo test -p te-python --lib
